---
- name: Configure the edge
  hosts: edge
  become: true
  pre_tasks:
    - name: Load secrets
      community.sops.load_vars:
        file: ../secrets/edge.sops.yaml
        name: edge_secrets
      delegate_to: localhost
      become: false
      no_log: true
  roles:
    - base
    - docker
    - stack
    - tailscale
    - monitoring
    - backup
    - pgbackrest_repo
    - deploy_key
