---
# Must stay re-runnable after a partial bootstrap: site.yml removes root's keys, so connect as root
# only when the deploy user cannot log in yet.
- name: Bootstrap users
  hosts: edge
  gather_facts: false
  become: true
  pre_tasks:
    # Probes login and passwordless sudo: a bootstrap can stop after the deploy key is authorised but before sudo.
    - name: Probe the deploy user
      ansible.builtin.ping:
      ignore_unreachable: true
      ignore_errors: true
      register: _deploy_probe

    - name: Fall back to root on a fresh droplet
      ansible.builtin.set_fact:
        ansible_user: root
      when: _deploy_probe is failed or (_deploy_probe.unreachable | default(false))

    - name: Drop the probe's connection
      ansible.builtin.meta: reset_connection

    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Load secrets
      community.sops.load_vars:
        file: ../secrets/edge.sops.yaml
        name: edge_secrets
      delegate_to: localhost
      become: false
      no_log: true
  roles:
    - users
  post_tasks:
    # set_fact outlives the play; site.yml in the same run must connect as the deploy user.
    - name: Hand back to the deploy user
      ansible.builtin.set_fact:
        ansible_user: "{{ deploy_user }}"

    - name: Drop the bootstrap connection
      ansible.builtin.meta: reset_connection
