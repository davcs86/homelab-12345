---
# Runs the nightly job on demand (backup, push, restore drill) and prints its journal.
- name: Backup and restore drill now
  hosts: edge
  become: true
  gather_facts: false
  tasks:
    - name: Run edge-backup.service
      ansible.builtin.systemd_service:
        name: edge-backup.service
        state: started
      register: _run
    - name: Wait for the oneshot to finish  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl show -p ActiveState --value edge-backup.service
      register: _state
      until: _state.stdout in ['inactive', 'failed']
      retries: 60
      delay: 5
      changed_when: false
    - name: Journal of this run
      ansible.builtin.command: journalctl -u edge-backup.service --since "-10min" --no-pager -o cat
      register: _journal
      changed_when: false
    - name: Show
      ansible.builtin.debug:
        var: _journal.stdout_lines
    - name: Fail if the run failed  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl show -p Result --value edge-backup.service
      register: _result
      changed_when: false
      failed_when: _result.stdout != 'success'
