---
# Recipients are public keys only. Decrypt with SOPS_AGE_SSH_PRIVATE_KEY_FILE pointing at either private key.
#   sops_admin  - David's key (password manager / workstation)
#   sops_deploy - GitHub Actions `production` environment secret SOPS_AGE_SSH_PRIVATE_KEY
# Rotating a recipient: edit this list, then `sops updatekeys secrets/*.sops.yaml`.
creation_rules:
  - path_regex: secrets/.*\.sops\.yaml$
    age: >-
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDGNXLrl0ATnFuzi5jmS7j3NI++yQKGJwx+BNZDt3X1b,
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC4XWHj7on22av0kCzpgCwLwxGFDXKxWauvP20WzJJNw
