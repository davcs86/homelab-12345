[defaults]
inventory = inventories/prod
roles_path = roles
collections_path = .collections
interpreter_python = /usr/bin/python3
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
host_key_checking = True
forks = 10
# Transparently decrypt *.sops.yml group/host vars (needs sops on PATH; see Makefile).
vars_plugins_enabled = host_group_vars, community.sops.sops

[inventory]
enable_plugins = digitalocean.cloud.droplets, ansible.builtin.yaml, ansible.builtin.host_list

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
