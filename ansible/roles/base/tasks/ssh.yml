---
# sshd uses the FIRST value it reads for each keyword and includes
# sshd_config.d/*.conf in lexical order, so 00- beats cloud-init's 50-.
- name: Install sshd hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and reload sshd

# Only after the admin account has been proven to work (i.e. not during the
# root bootstrap run itself).
- name: Remove root authorized_keys left by droplet creation
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  when: not (base_bootstrap | bool)
