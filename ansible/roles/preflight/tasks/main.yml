---
- name: Assert owner-decided variables are set (see group_vars/all/pending.yml)
  ansible.builtin.assert:
    that:
      - vars[item] is defined
      - vars[item] is not none
    fail_msg: >-
      '{{ item }}' is undecided. Set it in
      inventories/prod/group_vars/all/pending.yml (see comments there).
    quiet: true
  loop: "{{ preflight_required_vars }}"

- name: Assert edge_color is blue or green
  ansible.builtin.assert:
    that: edge_color is defined and edge_color in edge_colors
    fail_msg: "Pass -e edge_color=blue|green"
    quiet: true
  when: preflight_require_color | bool

- name: Assert value formats
  ansible.builtin.assert:
    that:
      - edge_image in ['ubuntu-24-04-x64', 'ubuntu-26-04-x64']
      - edge_droplet_backups | type_debug == 'bool'
      - edge_reserved_ip_enabled | type_debug == 'bool'
      - admin_username is match('^[a-z_][a-z0-9_-]{0,31}$')
      - admin_username != 'root'
      - admin_ssh_public_keys | length > 0
      - bootstrap_ssh_cidrs | type_debug == 'list'
      - bootstrap_ssh_cidrs | select('equalto', '0.0.0.0/0') | list | length == 0
      - bootstrap_ssh_cidrs | select('equalto', '::/0') | list | length == 0
    fail_msg: "A pending.yml value has an invalid format; public 0.0.0.0/0 or ::/0 SSH is never allowed."
    quiet: true
  when: preflight_required_vars | length > 0
