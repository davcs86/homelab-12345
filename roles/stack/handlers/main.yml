---
- name: Restart headscale
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml restart headscale
  changed_when: true

- name: Reload headscale policy
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml kill -s HUP headscale
  changed_when: true

- name: Reload caddy
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
  changed_when: true

- name: Restart caddy
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml restart caddy
  changed_when: true

- name: Restart gatus
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml restart gatus
  changed_when: true

- name: Restart ntfy
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml restart ntfy
  changed_when: true
