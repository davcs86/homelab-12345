---
name: init-secrets

# Generates secrets/edge.sops.yaml on the runner and commits only the encrypted file.
# Operator-chosen values come from `production` environment secrets; nothing is echoed.
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace an existing secrets/edge.sops.yaml (rotates every generated credential)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
      - name: Refuse to clobber unless asked
        if: ${{ !inputs.overwrite }}
        run: test ! -e secrets/edge.sops.yaml || { echo "::error::secrets/edge.sops.yaml exists; re-run with overwrite"; exit 1; }
      - name: Generate and encrypt
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          ADMIN_CONSOLE_PASSWORD: ${{ secrets.ADMIN_CONSOLE_PASSWORD }}
          NTFY_DAVID_PASSWORD: ${{ secrets.NTFY_DAVID_PASSWORD }}
        run: |
          host="edge.ts.$(awk '/^domain:/{print $2}' inventories/prod/group_vars/all/main.yml)"
          python3 scripts/init_secrets.py "$host" secrets/edge.sops.yaml
          grep -q '^sops:' secrets/edge.sops.yaml
      - name: Commit encrypted file
        run: |
          git add secrets/edge.sops.yaml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(secrets): generate edge.sops.yaml [run ${{ github.run_id }}]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
